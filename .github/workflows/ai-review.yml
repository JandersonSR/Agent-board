# AI pre-review, reusable by the team's repositories (opt-in).
# It only comments: never approves, never requests changes, never pushes. See docs/ci-ai-review.md.
# It needs the company's approval to send code to the model provider and an ANTHROPIC_API_KEY secret in the calling repository.
name: AI pre-review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
      max-lines:
        description: PRs larger than this are skipped with a note
        type: number
        default: 2000
      language:
        description: en or pt-BR
        type: string
        default: en
      skip-label:
        type: string
        default: no-ai-review
      tldeck-ref:
        description: TLDeck version used (tag or SHA; pin it so it does not change without you knowing)
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, inputs.skip-label)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout do PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Script de review
        uses: actions/checkout@v4
        with:
          repository: JandersonSR/tldeck
          ref: ${{ inputs.tldeck-ref }}
          path: .tldeck
          sparse-checkout: ci
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Pre-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MODEL: ${{ inputs.model }}
          MAX_LINES: ${{ inputs.max-lines }}
          LANG_OUT: ${{ inputs.language }}
        run: node .tldeck/ci/ai-review.mjs
